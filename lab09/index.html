<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reads the XML data using JavaScript</title>

    <!-- CSS -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #7ce2af
        }

        th {
            background-color: #7c0f65;
            color: white;
        }

        .button {
            position: relative;
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(55, 12, 211);
            background: rgba(20, 192, 4, 0.5);
            color: rgb(230, 36, 78);
            outline: none;
            border-radius: 30px;
            font-size: 30px;
            width: 500px;

        }

        .button:hover {
            color: black;
            background: white;
        }
       #toggleBtn {
        display: block;
        margin: 0 auto;
        max-width: 100%;}
       #Aicode{
        box-sizing: border-box;
        border-radius: 8px;
        border: solid blue 3px;
        margin-bottom: 5vh;
        padding: 2px 3px 5px 8px;
        background-color: aqua;
        color: rgb(255, 0, 0);
       }

    </style>

    <!--JavaScript-->
    <script>
        /* ------------------------------------------------------------------
         * AI-ASSISTED CODE (see "AI Assistance Documentation" on this page)
         * The three pieces below were added with help from generative AI:
         *   1. empLoaded   - remembers whether the XML has been fetched
         *   2. isOpen      - tracks the toggle state
         *   3. toggleEmployees() - shows/hides the table and updates the
         *                    button text and aria-expanded attribute
         * ------------------------------------------------------------------ */
        let empLoaded = false;   // AI-assisted: XML is only fetched once
        let isOpen = false;      // AI-assisted: current toggle state

        // AI-assisted: replaces the original loadXMLDoc() button handler
        function toggleEmployees() {
            const btn = document.getElementById("toggleBtn");
            const table = document.getElementById("id");

            if (isOpen) {
                // Table is showing -> hide it
                table.hidden = true;
                btn.textContent = "Get Employee Data";
                btn.setAttribute("aria-expanded", "false");
                isOpen = false;
            } else {
                // Table is hidden -> show it (fetch XML the first time only)
                if (!empLoaded) {
                    loadXMLDoc();
                }
                table.hidden = false;
                btn.textContent = "Close Employee Data";
                btn.setAttribute("aria-expanded", "true");
                isOpen = true;
            }
        }
        function loadXMLDoc() {
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
              
             
        
                // Request finished and response 
                // is ready and Status is "OK"
                if (this.readyState == 4 && this.status == 200) {
                    empDetails(this);
                    empLoaded = true;  
                }
            };

            // employee.xml is the external xml file
            xmlhttp.open("GET", "employee.xml", true);
            xmlhttp.send();
        }

        function empDetails(xml) {
            let i;
            let xmlDoc = xml.responseXML;
            let table =
                `<tr><th>Firstname</th><th>Lastname</th>
                    <th>Title</th><th>Division</th>
                    <th>Building</th><th>Room</th>
                </tr>`;
            let x = xmlDoc.getElementsByTagName("employee");

            // Start to fetch the data by using TagName 
            for (i = 0; i < x.length; i++) {
                table += "<tr><td>" +
                    x[i].getElementsByTagName("firstname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("lastname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("title")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("division")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("building")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("room")[0]
                        .childNodes[0].nodeValue + "</td></tr>";
            }

            // Print the xml data in table form
            document.getElementById("id").innerHTML = table;
        }
        
        
    </script>
</head>

<body>
   <section id="Aicode">
    <h1>AI Assistance Documentation</h1>
    <p>Tool: Claude (Anthropic). Prompt: update the code so the button toggles
       the table off and on, with the text "Get Employee Data" / "Close Employee Data".</p>
    <p>Changes: added toggleEmployees(), isOpen and empLoaded, and changed the
       button's onclick to call toggleEmployees().</p>

    </section>
        <!--Ai Documentation for button code to turn on and off the dataview-->
       <button type="button" class="button" id="toggleBtn"
        aria-expanded="false" aria-controls="id"
        onclick="toggleEmployees()">Get Employee Data</button>
    
    
    

    <br><br>
    <table id="id"></table>
</body>

</html>
