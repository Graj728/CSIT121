<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            
            <li><a href="tierlist.html"  >Tierlist</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
    
    <form >
        <p id="sh">Share Your Details</p>
        <div class="group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="Name" required>
        </div>
        <div class="group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
            </div>
        
        <div class="group"></div>
        <label for="answer">Do you agree with my Tierlist:</label>
        <input type="radio" name="answer" id="agree" value="yes">
        <label for="agree">yes</label>
        <input type="radio" name="answer" id="disagree" value="no">
        <label for="disagree">no</label>
        
        <div class="group">
            <label for="favorite">Choose your favorite language</label>
            <select name="favorite" id="favorite">
    <option value="">Select a language</option>
    <option value="python">Python</option>
    <option value="java">Java</option>
    <option value="javascript">JavaScript</option>
    <option value="C">C</option>
    
</select>
        </div>
        <div class="group">
             <p>Which languages do you use?</p>

    <input type="checkbox" name="use" id="python" value="python">
    <label for="python">Python</label>

    <input type="checkbox" name="use" id="java" value="java">
    <label for="java">Java</label>

    <input type="checkbox" name="use" id="javascript" value="javascript">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" name="use" id="C" value="C">
    <label for="C">C</label>

        </div>
        <div class="group">
            <label for="comment">Comments</label>
        <textarea name="comment" id="comment" placeholder="Write your comment"></textarea>
        </div>
        <div class="group">
            <input type="submit" value="Submit" id="button">
        </div>
    </form>
</body>
</html>
